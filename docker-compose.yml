services:
  corporate-portal-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms-corporate-portal-web
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    ports:
      - "5175:8080"
    restart: unless-stopped

  corporate-portal-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sms-corporate-portal-tunnel
    depends_on:
      - corporate-portal-web
    command: tunnel --no-autoupdate --url http://corporate-portal-web:8080
    restart: unless-stopped
