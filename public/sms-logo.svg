<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" role="img" aria-labelledby="smsLogoTitle smsLogoDesc">
  <title id="smsLogoTitle">Smart Marinetek Services Private Limited (SMS Pvt. Ltd.)</title>
  <desc id="smsLogoDesc">Container ship hull with stacked mineral emerald and brass gold cargo containers, ocean waves, and circular Smart Marinetek Services Private Limited emblem.</desc>
  <defs>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0E231E" />
      <stop offset="60%" stop-color="#15322B" />
      <stop offset="100%" stop-color="#224D41" />
    </linearGradient>
    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBE7D" />
      <stop offset="100%" stop-color="#C6A15B" />
    </linearGradient>
    <linearGradient id="containerAltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F6657" />
      <stop offset="100%" stop-color="#224D41" />
    </linearGradient>
    <path id="ringTextTop" d="M 306,104 A 56,56 0 1,1 418,104" />
    <path id="ringTextBottom" d="M 418,104 A 56,56 0 1,1 306,104" />
  </defs>

  <!-- Outer & Inner Emblem Rings with Warm Limestone Ivory Backing for Dark/Light Legibility -->
  <circle cx="362" cy="104" r="76" fill="#F6F4EE" stroke="#C6A15B" stroke-width="5.5" />
  <circle cx="362" cy="104" r="68" fill="none" stroke="#15322B" stroke-width="5" />
  <circle cx="362" cy="104" r="47" fill="none" stroke="#224D41" stroke-width="2" stroke-dasharray="180 40" />

  <!-- Circular Ring Typography -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="800" fill="#182E28" letter-spacing="0.7">
    <textPath href="#ringTextTop" startOffset="50%" text-anchor="middle">SMART MARINETEK SERVICES</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="10.2" font-weight="800" fill="#182E28" letter-spacing="1.1">
    <textPath href="#ringTextBottom" startOffset="50%" text-anchor="middle">PRIVATE LIMITED</textPath>
  </text>

  <!-- Stacked Cargo Containers -->
  <g transform="rotate(6, 175, 58)">
    <!-- Upper Tier -->
    <rect x="64" y="18" width="66" height="22" rx="2" fill="#F6F4EE" fill-opacity="0.12" stroke="#C6A15B" stroke-width="3" />
    <rect x="136" y="21" width="60" height="21" rx="2" fill="url(#containerAltGrad)" stroke="#DFBE7D" stroke-width="0.9" />
    <rect x="202" y="25" width="54" height="20" rx="2" fill="url(#containerGrad)" />
    <!-- Lower Tier -->
    <rect x="64" y="44" width="66" height="24" rx="2" fill="url(#containerGrad)" />
    <rect x="136" y="46" width="60" height="23" rx="2" fill="url(#containerAltGrad)" stroke="#DFBE7D" stroke-width="0.9" />
    <rect x="202" y="49" width="54" height="22" rx="2" fill="url(#containerGrad)" />
    <rect x="262" y="54" width="44" height="20" rx="2" fill="url(#containerAltGrad)" stroke="#DFBE7D" stroke-width="0.9" />
    <!-- Container Corrugation Ribs -->
    <g stroke="#FFFFFF" stroke-width="1.6" opacity="0.55">
      <line x1="82" y1="48" x2="82" y2="64" />
      <line x1="98" y1="48" x2="98" y2="64" />
      <line x1="114" y1="48" x2="114" y2="64" />
      <line x1="154" y1="25" x2="154" y2="38" />
      <line x1="172" y1="25" x2="172" y2="38" />
      <line x1="154" y1="50" x2="154" y2="65" />
      <line x1="172" y1="50" x2="172" y2="65" />
      <line x1="220" y1="53" x2="220" y2="67" />
      <line x1="238" y1="53" x2="238" y2="67" />
    </g>
  </g>

  <!-- Container Ship Hull with Subtle Brass Gold Rim -->
  <path d="M 14,56 L 210,88 L 350,122 L 344,148 L 46,148 L 58,134 L 14,56 Z" fill="url(#hullGrad)" stroke="#DFBE7D" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Ship Portholes -->
  <circle cx="212" cy="105" r="7.5" fill="#DFBE7D" />
  <circle cx="234" cy="110" r="6.2" fill="#DFBE7D" />
  <circle cx="253" cy="114" r="5" fill="#DFBE7D" />
  <circle cx="269" cy="118" r="4" fill="#DFBE7D" />

  <!-- Hull Wordmark -->
  <text x="72" y="140" font-family="'Arial Black', Impact, system-ui, sans-serif" font-size="33" font-weight="900" fill="#FFFFFF" letter-spacing="0.6">SMS Pvt. Ltd.</text>

  <!-- Maritime Ocean Waves -->
  <path d="M 56,162 C 74,150 96,150 116,162 C 136,174 158,174 178,162" fill="none" stroke="#2F6657" stroke-width="4.2" stroke-linecap="round" />
  <path d="M 164,166 C 188,152 214,152 238,165 C 262,176 286,175 310,163" fill="none" stroke="#2F6657" stroke-width="3.6" stroke-linecap="round" />
  <path d="M 92,172 C 114,164 136,164 156,173" fill="none" stroke="#DFBE7D" stroke-width="2.6" stroke-linecap="round" />
</svg>
